<style>

<script>

{id:'water',n:['Water','Agua'],z:'in',p:15,r:[{H:2,O:1}],f:'H₂O',fn:[['Reaction medium','Medio de reacción'],['Thermal control','Control térmico'],['Universal solvent','Disolvente universal']]},
{id:'salts',n:['Mineral salts','Sales minerales'],z:'in',p:20,r:[{Ca:1,C:1,O:3},{Ca:1,P:1,O:4}],f:'CaCO₃ / Ca-phosphate',fn:[['Bones, teeth and shells','Huesos, dientes y caparazones'],['Chemical balance of cells','Equilibrio químico de las células']]},

{id:'lipids',n:['Lipids','Lípidos'],z:'out',p:25,r:[{C:3,H:5,O:1}],f:'lots of C and H',fn:[['Long-term energy store','Reserva de energía a largo plazo'],['Cell membranes','Membranas celulares'],['Thermal insulation','Aislante térmico']]},
{id:'prot',n:['Proteins','Proteínas'],z:'out',p:30,r:[{C:1,H:1,O:1,N:1,S:1}],f:'amino acids',fn:[['Structure (collagen)','Estructura (colágeno)'],['Transport (haemoglobin)','Transporte (hemoglobina)'],['Enzymes','Enzimas'],['Defence (antibodies)','Defensa (anticuerpos)']]},
{id:'dna',n:['Nucleic acids','Ácidos nucleicos'],z:'out',p:35,r:[{C:1,H:1,O:1,N:1,P:1}],f:'DNA / RNA',fn:[['Stores genetic information','Almacena la información genética'],['Passes genes to the next generation','Transmite los genes a la descendencia']]}];
let bi=true,mute=false,state='start',inv={},lives=3,score=0,held=null,done=new Set,items=[],texts=[],level=1,fr=0,keys={},p=null,plats=[],qm=null,qs=[],first=true,up=false,ch=0,lock=0,fx=[],pt=0,sp=50,bc=0,bt=6+rnd(7);

function beep(f,d){if(mute)return;try{const a=beep.a||(beep.a=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}

 if(plats.every(e=>e.y>400||x>e.x+e.w+10||x+w<e.x-10||Math.abs(y-e.y)>=61)&&(!t||plats.some(e=>e.y<400&&e.y>y&&e.y<y+130&&Math.abs(e.x+e.w/2-m)<170))){plats.push({x,y,w,h:16});break}}})}
function setup(){
 $('bL').textContent=bi?'🇪🇸 Solo español':'🇬🇧 English + Español';$('bM').textContent=mute?'🔇':'🔊';
 $('badRow').innerHTML='<b>⚠️ '+B('Avoid','Evita')+':</b> '+Object.entries(BAD).map(([k,e])=>`<span class="chip" style="--c:#c93636"><b>${k}</b> ${N(e)}</span>`).join('');
 $('rec').innerHTML=MOL.map((m,i)=>`<button id="b${i}"><b>${i+1}. ${N(m.n)}</b><br><small>${m.z==='in'?B('Inorganic','Inorgánica'):B('Organic','Orgánica')} · ${m.f}</small><br><code>${m.r.map(rq).join(' / ')}</code> · +${m.p}</button>`).join('');
 $('fns').innerHTML=MOL.map((m,i)=>`<div class="fn" id="f${i}"><b>${N(m.n)}</b><span>${m.fn.map(f=>N(f)).join(' · ')}</span></div>`).join('');
 MOL.forEach((m,i)=>$('b'+i).onclick=()=>craft(i));
 $('note').innerHTML=B('<b>Keys:</b> ← → / A D move · ↑ / W / Space jump · 1–6 craft · F / ↓ deliver in a zone · P pause · H help. <b>Balls that reach the screen edge explode: −1 life if you are close!</b> <b>CHONPS</b> (blinking, +10 points) are the primary bioelements; Ca, Na, K, Mg, Cl are secondary; Fe is a trace element. Carbohydrates, lipids and proteins have no single formula: the recipes use their key elements.','<b>Teclas:</b> ← → / A D mover · ↑ / W / Espacio saltar · 1–6 fabricar · F / ↓ entregar en una zona · P pausa · H ayuda. <b>Las bolas que lleguen al borde de la pantalla explotan: −1 vida si estás cerca.</b> <b>CHONPS</b> (parpadean, +10 puntos) son los bioelementos primarios; Ca, Na, K, Mg y Cl son secundarios; Fe es un oligoelemento. Glúcidos, lípidos y proteínas no tienen una fórmula única: las recetas usan sus elementos clave.')}
function ui(){
 $('lv').innerHTML=B('Level','Nivel')+' <b>'+level+'</b>';$('sc').innerHTML=B('Score','Puntos')+' <b>'+score+'</b>';$('hp').textContent='❤️'.repeat(Math.max(lives,0))||'💔';
 $('held').innerHTML=held?'✋ '+N(held.n):'';
 $('inv').innerHTML=Object.entries(EL).map(([k,e])=>`<span class="chip" style="--c:${e[2]}"><b>${k}</b> ${N(e)}: <b>${inv[k]||0}</b> <small>${['','',B('secondary','secundario'),B('trace','oligo.')][e[3]]}</small></span>`).join('');
 MOL.forEach((m,i)=>{const b=$('b'+i);b.disabled=state!=='play'||done.has(m.id)||!rec(m);b.className=m.z+(done.has(m.id)?' dn':'');$('f'+i).classList.toggle('on',done.has(m.id))})}
function start(){Object.keys(EL).forEach(k=>inv[k]=0);lives=3;score=0;held=null;done=new Set;items=[];texts=[];fx=[];level=1;keys={};lock=0;pt=0;sp=50;bc=0;bt=6+rnd(7);qm=null;$('qm').classList.remove('on');$('hm').classList.remove('on');gen();
 p={x:380,y:370,w:24,h:36,vx:0,vy:0,on:false,f:1,inv:0};state='play';ch=135;
 msg('Welcome to the Nano-Lab! Catch C, H, O, N, P, S and build 6 biomolecules.','¡Bienvenido al Nano-Lab! Atrapa C, H, O, N, P, S y fabrica 6 biomoléculas.','#33d1ff',4500);ui()}

 if(done.has(m.id))return msg('Mission already done!','¡Misión ya completada!','#e8a200',2500);

 msg(`${m.n[0]} is ready! Go to the ${m.z==='in'?'LEFT (inorganic)':'RIGHT (organic)'} zone and press F.`,`¡${m.n[1]} lista! Ve a la zona ${m.z==='in'?'IZQUIERDA (inorgánica)':'DERECHA (orgánica)'} y pulsa F.`,'#2fbf71',3000);ui()}
function toss(){if(state!=='play')return;
 if(!held)return msg('Craft a molecule first (keys 1–6).','Fabrica primero una molécula (teclas 1–6).','',2500);
 const c=p.x+12,z=c<130?'in':c>W-130?'out':null;
 if(!z)return msg('Stand in a zone: left = inorganic, right = organic.','Ponte en una zona: izquierda = inorgánica, derecha = orgánica.','#e8a200',2500);
 if(z!==held.z){beep(180,.2);return msg(`Wrong zone! Is ${held.n[0]} inorganic or organic?`,`¡Zona incorrecta! ¿${held.n[1]} es inorgánica u orgánica?`,'#e84a4a',3500)}
 openQuiz(held)}
function openQuiz(m){state='quiz';keys={};qm=m;first=true;
 const o=sh(MOL.filter(x=>x!==m)).slice(0,2).map(x=>({f:x.fn[rnd(x.fn.length)],o:x}));
 qs=sh([{f:m.fn[rnd(m.fn.length)],o:m,ok:1},...o]);
 $('qc').innerHTML=`<h3>☕ ${B('Bonus question! +10 points on the first try','¡Pregunta bonus! +10 puntos a la primera')}</h3><p>${B('Which is a function of '+m.n[0]+'?','¿Cuál es una función de '+m.n[1]+'?')}</p>`+qs.map((q,i)=>`<button data-i="${i}">${i+1}. ${N(q.f)}</button>`).join('')+'<p id="qx"></p>';
 $('qc').querySelectorAll('button').forEach(b=>b.onclick=()=>ans(+b.dataset.i,b));$('qm').classList.add('on')}
function ans(i,b){const q=qs[i];
 if(!q.ok){first=false;b.disabled=true;b.style.opacity=.5;beep(190,.2);$('qx').innerHTML=B(`No: "${q.f[0]}" is a function of ${q.o.n[0]}. Try again!`,`No: «${q.f[1]}» es una función de ${q.o.n[1]}. ¡Inténtalo otra vez!`);return}
 const m=qm,bonus=first?10:0,pts=m.p+bonus,old=level;score+=pts;done.add(m.id);held=null;beep(880,.18);
 level=Math.min(3,1+(done.size>>1));up=level>old;
 $('qc').innerHTML=`<h3>✔ ${B('Mission complete!','¡Misión completada!')}</h3><p><b>${N(m.n)}</b>: ${m.fn.map(f=>N(f)).join(' · ')}</p><p>+${pts} ${bonus?B('points (with bonus!)','puntos (¡con bonus!)'):B('points','puntos')}</p><button id="go">${B('Continue','Continuar')} ▶</button>`;
 $('go').onclick=cont;ui()}
function cont(){$('qm').classList.remove('on');qm=null;const w=done.size===MOL.length;ch=135;state=w?'win':'play';
 if(w)msg('Cell activated!','¡Célula activada!','#2fbf71',9e5);
 else if(up)msg(`Level ${level}! Things fall faster.`,`¡Nivel ${level}! Todo cae más rápido.`,'#33d1ff',3000);

function spawn(){const bad=Math.random()<.32+level*.03;let s;
 if(bad){const K=Object.keys(BAD);s=K[rnd(K.length)]}
 else{const pool=['C','C','H','H','H','O','O','O','O','N','P','S','S','Ca','Na','K','Mg','Cl','Fe'];
  MOL.forEach(m=>{if(!done.has(m.id)&&!(held&&held.id===m.id)){const r=m.r[rnd(m.r.length)];for(const k in r)if((inv[k]||0)<r[k])pool.push(k,k)}});s=pool[rnd(pool.length)]}
 const sd=Math.random()<.4,L=Math.random()<.5;items.push(sd?{s,bad,x:L?-18:W+18,y:30+Math.random()*190,vx:(L?1:-1)*(1.6+Math.random()*1.8),vy:-.5+Math.random()*1.2,age:0,b:0,en:0}:{s,bad,x:30+Math.random()*(W-60),y:-18,vx:(Math.random()-.5)*2.6,vy:1+level*.2+Math.random()*.8,age:0,b:0,en:1})}
const BR=90;

function edge(it){const ex=it.x<15?15:W-15;if(p.inv>0||Math.hypot(p.x+12-ex,p.y+18-it.y)>BR){beep(150,.2);return}lives--;p.inv=90;ch=135;scream();const nm=it.life?['Heart','Corazón']:(it.bad?BAD:EL)[it.s];

function update(){
 pt++;if(--sp<=0){spawn();sp=Math.max(40,Math.round(110-pt/35-level*6))}
 p.vx=((keys.r?1:0)-(keys.l?1:0))*4.2;if(p.vx)p.f=p.vx>0?1:-1;
 p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx));p.vy+=.6;p.y+=p.vy;p.on=false;
 for(const q of plats)if(q.y<400&&p.vy<0&&p.x+p.w>q.x&&p.x<q.x+q.w&&p.y-p.vy>=q.y+q.h-1&&p.y<q.y+q.h){p.y=q.y+q.h;p.vy=1;beep(160,.05);fl('💥','#ffd166');if(++bc>=bt){bc=0;bt=6+rnd(7);const hr=Math.random()<1/3,nd=[];MOL.forEach(m=>{if(!done.has(m.id)){const r=m.r[0];for(const k in r)if(EL[k][3]===1&&(inv[k]||0)<r[k])nd.push(k)}});const s=hr?'❤':nd.length?nd[rnd(nd.length)]:'CHONPS'[rnd(6)];
